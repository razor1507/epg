name: Update EPG
on:
  schedule:
    - cron: "0 */6 * * *"   # la fiecare 6 ore
  workflow_dispatch:         # buton "Run workflow" pentru rulare manuala
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_epg.py
      - name: Commit epg.xml
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add epg.xml
          git diff --staged --quiet || (git commit -m "Update epg.xml" && git push)
